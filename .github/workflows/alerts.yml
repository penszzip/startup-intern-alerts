name: intern alerts

on:
  schedule:
    # Every 10 min for the real-time ATS watcher. GitHub delays scheduled
    # workflows under load, so treat this as "roughly every 10-25 minutes".
    - cron: "*/10 * * * *"
    # Every 30 min for the broad startup.jobs sweep (its data is 24h delayed
    # anyway, so precision here is irrelevant).
    - cron: "7,37 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Prevent two runs racing to commit state.
concurrency:
  group: intern-alerts
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit state files back

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # No pip install: the project is stdlib-only.

      - name: Run watcher
        env:
          STARTUP_JOBS_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_TO }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event.schedule }}" = "7,37 * * * *" ]; then
            python main.py
          else
            python atswatch.py
          fi

      - name: Persist state
        run: |
          # State files change only when new postings are found, so this
          # commits on real news rather than on every run.
          if [ -n "$(git status --porcelain state.json ats_state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json ats_state.json
            git commit -m "state: alerted postings [skip ci]"
            # Another run may have pushed since checkout; rebase and retry once.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "no state change"
          fi
